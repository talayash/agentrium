name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch / PR to keep the queue tidy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; without this block the token gets the repo default.
permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Fails on template injection, cache poisoning in release jobs, persisted
      # checkout credentials and broad permissions, so the release pipeline
      # hardening from the 2026-11-05 assessment (F8, F9) cannot regress.
      - name: zizmor
        run: pipx run zizmor==1.16.0 --offline --min-severity=medium .github/workflows/

  frontend:
    name: Frontend (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run vitest
        run: npm run test:run

  analytics:
    name: Analytics worker (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/ct-analytics
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: workers/ct-analytics/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest
        run: npm run test:run

  backend:
    name: Backend (cargo test)
    runs-on: ubuntu-latest
    env:
      # crates.io intermittently returns "Error in the HTTP2 framing layer"
      # on the GitHub Actions runners (last seen 2026-05-29 run 71338258625).
      # Disabling HTTP/2 multiplexing and bumping the retry count is the
      # documented mitigation - cargo falls back to HTTP/1.1 for the fetch.
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '10'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'
          # Keep the test profile separate from the release profile cached by
          # release.yml so they don't churn each other out.
          shared-key: 'ci-test'

      - name: Install Tauri Linux build deps
        # `cargo test` still compiles the full dependency graph, including
        # tauri's webkit2gtk bindings. These packages are required for the
        # link step to succeed on Ubuntu 24.04.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Fetch dependencies
        # Separating fetch from test means a transient registry blip only
        # retries the (cheap, fast) fetch step instead of restarting the
        # 5+ minute compile. The shell `for` loop adds a job-level retry
        # on top of CARGO_NET_RETRY, which only retries individual files.
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi
            echo "cargo fetch failed (attempt $attempt) - retrying in 15s"
            sleep 15
          done
          echo "cargo fetch failed after 3 attempts"
          exit 1

      - name: Run cargo test
        working-directory: src-tauri
        # --offline forces use of the cache populated by the fetch step;
        # any remaining network errors here would be a real bug.
        run: cargo test --locked --offline
