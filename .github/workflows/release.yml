name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format '$VERSION'. Must be X.Y.Z (e.g., 1.9.0)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          name: ClaudeTerminal v${{ steps.get-version.outputs.version }}
          draft: true
          prerelease: false
          body: |
            ## ClaudeTerminal v${{ steps.get-version.outputs.version }}

            ### Installation
            Download the appropriate installer for your platform:
            - **Windows**: `.msi` or `.exe` (NSIS installer)
            - **macOS (Apple Silicon)**: `.dmg`
            - **macOS (Intel)**: `.dmg`

            ### Auto-Update
            Existing users will be notified of this update automatically.

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    # Lifted to job-level so step `if:` conditions can read it (step env isn't available there).
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # crates.io intermittently returns "Error in the HTTP2 framing layer" on
      # GitHub Actions. Force HTTP/1.1 and bump the retry count so transient
      # blips don't fail a full release build.
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '10'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Install Azure Trusted Signing client (Windows)
        if: matrix.platform == 'windows-latest' && env.AZURE_TENANT_ID != ''
        shell: pwsh
        run: |
          $dlibDir = Join-Path $env:RUNNER_TEMP 'TrustedSigningClient'
          New-Item -ItemType Directory -Force -Path $dlibDir | Out-Null
          Invoke-WebRequest -Uri 'https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client' -OutFile (Join-Path $dlibDir 'tsc.zip')
          Expand-Archive -Path (Join-Path $dlibDir 'tsc.zip') -DestinationPath $dlibDir -Force
          $dlib = Get-ChildItem -Path $dlibDir -Recurse -Filter 'Azure.CodeSigning.Dlib.dll' | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if (-not $dlib) { throw 'Azure.CodeSigning.Dlib.dll (x64) not found' }
          $metadata = Join-Path $env:RUNNER_TEMP 'metadata.json'
          @{
            Endpoint              = '${{ vars.TRUSTED_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.TRUSTED_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ vars.TRUSTED_SIGNING_PROFILE }}'
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding UTF8
          "TRUSTED_SIGNING_DLIB=$($dlib.FullName)"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "TRUSTED_SIGNING_METADATA=$metadata"         | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          "TRUSTED_SIGNING_ENABLED=true"               | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8
          # signtool from the latest installed Windows SDK
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) { "SIGNTOOL_PATH=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding UTF8 }

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CT_INGEST_TOKEN: ${{ secrets.CT_INGEST_TOKEN }}
          # Azure auth for the Trusted Signing DLib (DefaultAzureCredential picks these up).
          # AZURE_TENANT_ID inherited from job-level env. sign-windows.ps1 no-ops when TRUSTED_SIGNING_ENABLED is unset.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonKeepUniversal: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });

      - name: Trigger website rebuild
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: talayash/claude-terminal-website
          event-type: new-release
