[package]
name = "claude-terminal"
version = "1.33.4"
edition = "2021"

[features]
default = []
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
notify-rust = "4"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
directories = "6"
open = "5"
strip-ansi-escapes = "0.2"
regex = "1"
sha2 = "0.10"
# reqwest 0.13 split the old `rustls-tls` feature into `rustls` (the TLS
# stack) + an explicit root store; `webpki-roots` keeps the bundled roots
# behavior 0.12's `rustls-tls` had.
reqwest = { version = "0.13", features = ["json", "rustls", "webpki-roots"], default-features = false }
url = "2"
trash = "5"
tiny_http = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"

# On Windows, we reach into the underlying CoreWebView2 to disable the
# default browser context menu (Back/Refresh/Save-as/Inspect) - otherwise
# right-click → Refresh inside the preview iframe reloads the top-level
# app and closes every open terminal. Matches the version Tauri already
# pulls in transitively so nothing extra needs to compile.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
panic = "abort"
